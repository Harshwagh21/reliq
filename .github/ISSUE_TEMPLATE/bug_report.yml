name: Bug report
description: Report incorrect or unexpected behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please check `docs/DESIGN.md` for intended semantics before reporting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What does DESIGN.md or docs say should happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal Go snippet or steps.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RELIQ version / commit
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go version
    validations:
      required: true
